# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll with GitHub Pages dependencies preinstalled

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/Resume/Gemfile
      JEKYLL_ENV: production
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true
          working-directory: .
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: Portfolio/scripts/requirements-thumbnails.txt
      - name: Generate portfolio card thumbnails
        run: |
          python -m pip install -r Portfolio/scripts/requirements-thumbnails.txt
          python Portfolio/scripts/generate_card_thumbnails.py
      - name: Build with Jekyll
        run: bundle exec jekyll build --config _config.yml --destination "${{ github.workspace }}/_site/Resume" --trace
      - name: Build Portfolio
        run: bundle exec jekyll build --source Portfolio --config Portfolio/_config.yml,Portfolio/_config.production.yml --destination "${{ github.workspace }}/_site/Portfolio" --trace
      - name: Add root page
        run: |
          cp index.html _site/index.html
          cp about.md _site/about.md
          cp license.html _site/license.html
          cp Resume/LICENSE _site/LICENSE.md
          cp 403.html _site/403.html
          cp 404.html _site/404.html
          cp robots.txt _site/robots.txt
          cp -R assets _site/assets
          cp Resume/assets/img/common/favicon.ico _site/favicon.ico
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test build processing
        run: node scripts/finalize-site.test.cjs
      - name: Finalize and validate all pages
        run: node scripts/finalize-site.cjs _site
      - name: Inject and verify analytics in all generated pages
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = '_site';
          const analytics = `<script id="site-analytics">
          (function () {
            if (window.siteAnalytics) return;
            var measurementId = 'G-6GHV7BHE5J';
            var disableKey = 'ga-disable-' + measurementId;
            var host = window.location.hostname;
            var excluded = ['localhost', '127.0.0.1', '0.0.0.0', '[::1]'].indexOf(host) !== -1;
            try { excluded = excluded || localStorage.getItem('exclude_analytics') === 'true'; } catch (e) {}

            function disable() { window[disableKey] = true; }
            window.siteAnalytics = {
              exclude: function () {
                disable();
                try { localStorage.setItem('exclude_analytics', 'true'); } catch (e) {}
              }
            };
            window.addEventListener('storage', function (event) {
              if (event.key === 'exclude_analytics' && event.newValue === 'true') disable();
            });
            if (excluded || window[disableKey]) { disable(); return; }

            window.dataLayer = window.dataLayer || [];
            window.gtag = function () {
              if (!window[disableKey]) window.dataLayer.push(arguments);
            };
            window.gtag('js', new Date());
            window.gtag('config', measurementId);
            var script = document.createElement('script');
            script.async = true;
            script.src = 'https://www.googletagmanager.com/gtag/js?id=' + measurementId;
            document.head.appendChild(script);
          })();
          </script>`;
          function htmlFiles(dir) {
            return fs.readdirSync(dir, {withFileTypes: true}).flatMap(entry => {
              const file = path.join(dir, entry.name);
              return entry.isDirectory() ? htmlFiles(file) : /\.html?$/i.test(file) ? [file] : [];
            });
          }
          const files = htmlFiles(root).filter(file => /<head\b/i.test(fs.readFileSync(file, 'utf8')));
          if (!files.length) throw new Error('No generated HTML found');
          for (const file of files) {
            let html = fs.readFileSync(file, 'utf8');
            if (!/<head\b[^>]*>/i.test(html)) throw new Error('Missing head: ' + file);
            if (/googletagmanager\.com\/gtag\/js|site-analytics\.js|gtag\(['"]config/i.test(html)) {
              throw new Error('Page-specific analytics must be removed: ' + file);
            }
            html = html.replace(/(<head\b[^>]*>)\s*/i, (_, head) => head + '\n' + analytics);
            fs.writeFileSync(file, html);
          }
          for (const file of files) {
            const html = fs.readFileSync(file, 'utf8');
            if ((html.match(/id="site-analytics"/g) || []).length !== 1 || !html.includes(analytics)) {
              throw new Error('Analytics injection verification failed: ' + file);
            }
          }
          console.log('Analytics injected and verified in ' + files.length + ' HTML files');
          NODE
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
