<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>404 · 페이지를 찾을 수 없습니다</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=20260824">
    <link rel="stylesheet" href="/assets/css/site-overlays.css">
    <style>
      @font-face{font-family:"Noto Sans KR";src:url("/Resume/assets/font/NotoSansKR.woff2") format("woff2");font-weight:100 900;font-display:swap}
      *{box-sizing:border-box}
      body{display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0;padding:24px;background:#f0f0f0;color:#222;font-family:"Noto Sans KR","Malgun Gothic",sans-serif}
      .error-card{width:560px;max-width:100%;padding:34px 38px;border:0;background:#fff;box-shadow:0 3px 14px rgba(0,0,0,.12)}
      .error-code{display:block;margin-bottom:9px;color:#f5821f;font-size:10px;font-weight:700;letter-spacing:.12em}
      h1{margin:0 0 10px;font-size:22px;line-height:1.45}
      p{margin:0 0 28px;color:#666;font-size:13px;line-height:1.7}
      .error-card>a{display:inline-flex;min-height:42px;align-items:center;padding:10px 17px;border:1px solid #333;background:#fff;color:#222;font-size:12px;font-weight:700;text-decoration:none;transition:background .18s ease,color .18s ease}
      .error-card>a:hover{background:#222;color:#fff}
      @media(max-width:680px){body{padding:14px}.error-card{padding:27px 24px}h1{font-size:19px}}
    </style>
  </head>
  <body class="error-page">
    <main class="error-card">
      <small class="error-code">ERROR 404</small>
      <h1>페이지를 찾을 수 없습니다.</h1>
      <p>요청하신 페이지가 존재하지 않거나 다른 위치로 이동되었습니다.</p>
      <a href="/">메인으로 돌아가기&nbsp; →</a>
    </main>
    <script src="/assets/js/site-overlays.js"></script>
  </body>
</html>
