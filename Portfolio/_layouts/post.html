---
layout: default
---
<article class="post-document"><header class="post-header"><small>{{ page.category_label }}</small><h1>{{ page.title }}</h1><p>{{ page.summary }}</p><div class="post-meta">{% if page.date %}<time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y.%m.%d" }}</time>{% endif %}{% for tag in page.tags %}<span>{{ tag }}</span>{% endfor %}</div></header><div class="post-content">{{ content }}</div><a class="post-back" href="{{ '/' | relative_url }}">← 포트폴리오 목록</a></article>
