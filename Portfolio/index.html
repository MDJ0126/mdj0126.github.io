<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="문동준 | Portfolio">
    <meta name="twitter:description" content="게임 클라이언트 개발자 문동준의 포트폴리오">
    <meta name="twitter:image" content="https://mdj0126.github.io/Resume/assets/img/picture/profile-og.png?v=20260824">
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=20260824">
    <style>
      @font-face{font-family:"Noto Sans KR";src:url("/Resume/assets/font/NotoSansKR.woff2") format("woff2");font-weight:100 900;font-display:swap}
      *{box-sizing:border-box}
      body{display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0;padding:24px;background:#f0f0f0;color:#222;font-family:"Noto Sans KR","Malgun Gothic",sans-serif;text-align:center}
      .page-loading{overflow:hidden}
      .loading-screen{position:fixed;z-index:9999;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;background:#f0f0f0;opacity:1;transition:opacity .2s ease}
      .loading-screen.is-hidden{pointer-events:none;opacity:0}
      .loading-document{width:48px;height:62px;padding:12px 9px;border:1px solid #777;background:#fff;box-shadow:0 3px 9px rgba(0,0,0,.1)}
      .loading-document span{display:block;height:2px;margin-bottom:7px;background:#aaa;animation:loading-line 1.2s ease-in-out infinite}
      .loading-document span:nth-child(2){width:72%;animation-delay:.12s}
      .loading-document span:nth-child(3){width:88%;animation-delay:.24s}
      .loading-document span:nth-child(4){width:60%;animation-delay:.36s}
      .loading-message{display:flex;width:min(390px,calc(100vw - 40px));min-height:62px;margin:0;flex-direction:column;justify-content:center;gap:8px;color:#333;font-size:15px;font-weight:400;line-height:1.6;text-align:center}
      .greeting-line{display:block;opacity:0;transform:translate3d(0,8px,0);transition:opacity .4s ease,transform .4s ease}
      .greeting-line.is-visible{opacity:1;transform:translate3d(0,0,0)}
      .experience-highlight{color:#f5821f;font-style:normal;font-weight:700}
      .loading-name{color:#111;font-weight:700}
      @keyframes loading-line{0%,100%{opacity:.25}50%{opacity:1}}
      h1{margin:0 0 8px;font-size:22px}
      p{margin:0 0 22px;color:#666;font-size:13px}
      a{display:inline-block;padding:12px 18px;border:1px solid #333;background:#fff;color:#222;font-size:12px;font-weight:600;text-decoration:none}
      a:hover{background:#222;color:#fff}
    </style>
  </head>
  <body>
    <div class="loading-screen" id="loading-screen" role="status" aria-live="polite">
      <div class="loading-document" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
      <p class="loading-message">
        <span class="greeting-line">안녕하세요.</span>
        <span class="greeting-line"><em class="experience-highlight">8년 차</em> 게임 클라이언트 프로그래머 <strong class="loading-name">문동준</strong>입니다.</span>
      </p>
    </div>
    <main>
      <h1>Portfolio</h1>
      <p>포트폴리오 페이지를 준비하고 있습니다.</p>
      <a href="/">메인으로 돌아가기</a>
    </main>
    <script>
      (function () {
        var finished = false;
        var greetingStarted = false;

        function finishLoading() {
          if (finished) return;
          finished = true;
          requestAnimationFrame(function () {
            document.documentElement.classList.remove('page-loading');
            var screen = document.getElementById('loading-screen');
            if (!screen) return;
            screen.classList.add('is-hidden');
            setTimeout(function () { screen.remove(); }, 220);
          });
        }

        function showGreeting() {
          if (greetingStarted || finished) return;
          greetingStarted = true;
          var lines = document.querySelectorAll('.greeting-line');
          lines.forEach(function (line, index) {
            setTimeout(function () { line.classList.add('is-visible'); }, index * 350);
          });
          setTimeout(finishLoading, ((lines.length - 1) * 350) + 1000);
        }

        window.addEventListener('load', function () {
          var fonts = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
          fonts.then(function () {
            requestAnimationFrame(function () { requestAnimationFrame(showGreeting); });
          });
        });
        setTimeout(finishLoading, 7000);
      })();
    </script>
  </body>
</html>
