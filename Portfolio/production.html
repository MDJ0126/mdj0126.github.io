<!doctype html>
<html lang="ko">
<head>

    body{display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0;background:#f0f0f0;color:#222;font-family:"Noto Sans KR","Malgun Gothic",sans-serif;text-align:center}
