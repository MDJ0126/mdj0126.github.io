<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>try{if(sessionStorage.getItem('resume-loading-shown')==='true'){document.documentElement.classList.add('resume-skip-loading')}else{sessionStorage.setItem('resume-loading-shown','true');document.documentElement.classList.add('page-loading')}}catch(e){document.documentElement.classList.add('page-loading')}</script>
  <style>.resume-skip-loading .loading-screen{display:none}</style>
  <title>{{ site.author.name_ko }} 이력서</title>
  <meta name="description" content="Unity와 C#을 기반으로 초기 개발부터 글로벌 출시와 라이브 서비스를 담당한 게임 클라이언트 개발자 문동준의 이력서입니다.">
  {% if site.google_analytics and site.google_analytics != "" %}
  <script>
    try {
      var host = window.location.hostname;
      var isLocal = host === 'localhost' || host === '127.0.0.1' || host === '0.0.0.0' || host === '[::1]';
      if (isLocal || localStorage.getItem('exclude_analytics') === 'true') window['ga-disable-{{ site.google_analytics }}'] = true;
    } catch (e) {}
  </script>
  <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag('js',new Date());gtag('config','{{ site.google_analytics }}');</script>
  {% endif %}
  <meta name="robots" content="noindex, nofollow">
  <meta property="og:type" content="profile">
  <meta property="og:url" content="{{ site.url }}{{ site.baseurl }}/">
  <meta property="og:title" content="{{ site.author.name_ko }}">
  <meta property="og:description" content="8년 경력 게임 클라이언트 개발자 문동준의 이력서">
  <meta property="og:image" content="{{ site.url }}{{ site.baseurl }}{{ site.thumbnail }}?v=20260824">
  <meta property="og:image:secure_url" content="{{ site.url }}{{ site.baseurl }}{{ site.thumbnail }}?v=20260824">
  <meta property="og:image:width" content="1731">
  <meta property="og:image:height" content="908">
  <meta property="og:image:alt" content="게임 클라이언트 개발자 문동준">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ site.author.name_ko }}">
  <meta name="twitter:description" content="8년 경력 게임 클라이언트 개발자 문동준의 이력서">
  <meta name="twitter:image" content="{{ site.url }}{{ site.baseurl }}{{ site.thumbnail }}?v=20260824">
  <link rel="icon" type="image/x-icon" href="/favicon.ico?v=20260824"><link rel="stylesheet" href="{{ '/assets/font/font.css' | relative_url }}"><link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
