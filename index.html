    <script>
      (function () {
        function inlineMarkdown(text) {
          var fragment = document.createDocumentFragment();
          text.split(/(\*\*[^*]+\*\*)/).forEach(function (part) {
            if (part.slice(0, 2) === '**' && part.slice(-2) === '**') {
              var strong = document.createElement('strong');
              strong.textContent = part.slice(2, -2);
              if (strong.textContent === '8년 차') strong.className = 'experience';
              fragment.appendChild(strong);
            } else {
              fragment.appendChild(document.createTextNode(part));
            }
          });
          return fragment;
        }

        function loadAbout() {
          return fetch('/about.md', { cache: 'no-cache' }).then(function (response) {
            if (!response.ok) throw new Error('about.md를 불러오지 못했습니다.');
            return response.text();
          }).then(function (markdown) {
            var lines = markdown.replace(/\r/g, '').trim().split('\n');
            var headline = lines.find(function (line) { return line.indexOf('# ') === 0; });
            var title = lines.find(function (line) { return line.indexOf('## ') === 0; });
            var titleIndex = lines.indexOf(title);
            var description = lines.slice(titleIndex + 1).filter(function (line) { return line.trim(); });
            var headlineElement = document.getElementById('about-headline');
            headlineElement.replaceChildren(inlineMarkdown(headline.slice(2).trim()));
            document.getElementById('intro-title').textContent = title.slice(3).trim();
            var descriptionElement = document.getElementById('about-description');
            descriptionElement.replaceChildren();
            description.forEach(function (line, index) {
              if (index) descriptionElement.appendChild(document.createElement('br'));
              descriptionElement.appendChild(document.createTextNode(line.replace(/\s{2}$/, '').trim()));
            });
          }).catch(function () {
            document.getElementById('about-headline').textContent = '소개 내용을 불러오지 못했습니다.';
            document.getElementById('intro-title').textContent = 'ABOUT ME';
          });
        }

        var aboutReady = loadAbout();
        var emailAddress = 'ehdwns0126@naver.com';
        var copyEmailButton = document.getElementById('copy-email');
        var copyToast = document.getElementById('copy-toast');
        var copyToastTimer;

        function showCopyToast(message) {
          if (!copyToast) return;
          copyToast.textContent = message;
          copyToast.classList.add('is-visible');
          clearTimeout(copyToastTimer);
          copyToastTimer = setTimeout(function () {
            copyToast.classList.remove('is-visible');
          }, 2200);
        }

        function fallbackCopyEmail() {
          var textarea = document.createElement('textarea');
          textarea.value = emailAddress;
          textarea.setAttribute('readonly', '');
          textarea.style.position = 'fixed';
          textarea.style.opacity = '0';
          document.body.appendChild(textarea);
          textarea.select();
          var copied = document.execCommand('copy');
          textarea.remove();
          return copied;
        }

        if (copyEmailButton) {
          copyEmailButton.addEventListener('click', function () {
            var copyTask;
            if (navigator.clipboard && window.isSecureContext) {
              copyTask = navigator.clipboard.writeText(emailAddress).then(function () { return true; });
            } else {
              copyTask = Promise.resolve(fallbackCopyEmail());
            }
            copyTask.then(function (copied) {
              showCopyToast(copied ? '이메일 주소를 복사했습니다.' : '이메일 주소를 복사하지 못했습니다.');
            }).catch(function () {
              showCopyToast(fallbackCopyEmail() ? '이메일 주소를 복사했습니다.' : '이메일 주소를 복사하지 못했습니다.');
            });
          });
        }

        var profileLink = document.querySelector('.github-profile');
        var profileGuide = document.getElementById('github-profile-guide');
        var profileResetTimer;

        function hideProfileGuide() {
          profileLink.classList.remove('is-confirming');
          if (profileGuide) profileGuide.classList.remove('is-visible');
        }

        if (profileLink) {
          profileLink.addEventListener('click', function (event) {
            if (profileLink.classList.contains('is-confirming')) return;
            event.preventDefault();
            profileLink.classList.add('is-confirming');
            if (profileGuide) {
              var gap = 14;
              var rect = profileGuide.getBoundingClientRect();
              var x = Math.min(event.clientX + gap, window.innerWidth - rect.width - 12);
              var y = event.clientY + gap;
              if (y + rect.height > window.innerHeight - 12) y = event.clientY - rect.height - gap;
              profileGuide.style.left = Math.max(12, x) + 'px';
              profileGuide.style.top = Math.max(12, y) + 'px';
              profileGuide.classList.add('is-visible');
            }
            clearTimeout(profileResetTimer);
            profileResetTimer = setTimeout(hideProfileGuide, 4000);
          });
          document.addEventListener('click', function (event) {
            if (!profileLink.contains(event.target)) hideProfileGuide();
          });
          profileLink.addEventListener('blur', hideProfileGuide);
        }

        var finished = false;
        var greetingStarted = false;

        function finishLoading() {
          if (finished) return;
          finished = true;
          requestAnimationFrame(function () {
            document.documentElement.classList.remove('page-loading');
            var screen = document.getElementById('loading-screen');
            if (!screen) return;
            screen.classList.add('is-hidden');
            setTimeout(function () { screen.remove(); }, 220);
          });
        }

        function showGreeting() {
          if (greetingStarted || finished) return;
          greetingStarted = true;
          var lines = document.querySelectorAll('.greeting-line');
          lines.forEach(function (line, index) {
            setTimeout(function () { line.classList.add('is-visible'); }, index * 350);
          });
          setTimeout(finishLoading, ((lines.length - 1) * 350) + 1000);
        }

        if (document.documentElement.classList.contains('root-skip-loading')) {
          aboutReady.finally(finishLoading);
        } else {
          window.addEventListener('load', function () {
            var fonts = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
            Promise.all([fonts, aboutReady]).then(function () {
              requestAnimationFrame(function () { requestAnimationFrame(showGreeting); });
            });
          });
          setTimeout(finishLoading, 7000);
        }
      })();
    </script>
